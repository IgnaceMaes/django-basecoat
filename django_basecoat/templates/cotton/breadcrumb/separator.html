{% comment %}
Breadcrumb separator component - chevron separator between breadcrumb items
Usage: 
  <c-breadcrumb>
    <c-breadcrumb-item href="/">Home</c-breadcrumb-item>
    <c-breadcrumb-separator />
    <c-breadcrumb-item href="/products">Products</c-breadcrumb-item>
    <c-breadcrumb-separator />
    <c-breadcrumb-item current>Current Page</c-breadcrumb-item>
  </c-breadcrumb>
{% endcomment %}

</li>
