{% comment %}
Accordion component - uses native <details> element styled by Basecoat
Usage:
  <c-accordion>
    <c-accordion-item summary="Is it accessible?">
      Yes. It adheres to the WAI-ARIA design pattern.
    </c-accordion-item>
    <c-accordion-item summary="Is it styled?">
      Yes. It comes with default styles.
    </c-accordion-item>
  </c-accordion>

Note: Basecoat doesn't have a dedicated accordion component.
It uses native <details> elements with animations.
{% endcomment %}
<div class="accordion {{ class }}" {{ attrs }}>
  {{ slot }}
</div>
