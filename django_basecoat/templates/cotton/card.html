{% comment %}
Card component - displays a card with header, content, and footer
Usage:
  <c-card>
    <c-card.header>
      <h2>Card Title</h2>
      <p>Card subtitle</p>
    </c-card.header>
    <c-card.section>Card content goes here</c-card.section>
    <c-card.footer>Footer actions</c-card.footer>
  </c-card>
  
The card structure follows Basecoat's HTML:
  <div class="card">
    <header>...</header>
    <section>...</section>
    <footer>...</footer>
  </div>
{% endcomment %}
<div 
  class="card {{ class }}"
  {{ attrs }}
>
  {{ slot }}
</div>
