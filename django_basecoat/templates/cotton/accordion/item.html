{% comment %}
Accordion item component - a single item in an accordion
Usage:
  <c-accordion-item summary="Question text">
    Answer content here.
  </c-accordion-item>
{% endcomment %}
<details class="{{ class }}" {{ attrs }}>
  <summary>
    <span>{{ summary }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </summary>
  <section>{{ slot }}</section>
</details>
