{% comment %}
Input Group component - combining inputs with buttons, icons or text
Usage:
  <c-input.group>
    <c-input placeholder="Search..." />
    <c-button variant="default">Search</c-button>
  </c-input.group>
  
  <c-input.group>
    <span class="px-3 flex items-center text-muted-foreground">https://</span>
    <c-input placeholder="example.com" />
  </c-input.group>
  
Note: Basecoat doesn't have a dedicated input-group class.
Use flex layout with appropriate styling for grouped inputs.
{% endcomment %}
<div 
  class="flex overflow-hidden rounded-md border border-input shadow-sm has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-ring has-[:focus-visible]:ring-offset-2 has-[:disabled]:opacity-50 {{ class }}"
  {{ attrs }}
>
  {{ slot }}
</div>
