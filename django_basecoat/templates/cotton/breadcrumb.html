{% comment %}
Breadcrumb component - displays path hierarchy
Usage:
  <c-breadcrumb>
    <c-breadcrumb-item href="/">Home</c-breadcrumb-item>
    <c-breadcrumb-item href="/products">Products</c-breadcrumb-item>
    <c-breadcrumb-item>Current Page</c-breadcrumb-item>
  </c-breadcrumb>
  
Note: Basecoat doesn't have a dedicated breadcrumb component.
Style with text-muted-foreground and Tailwind utilities.
{% endcomment %}
<ol 
  class="text-muted-foreground flex flex-wrap items-center gap-1.5 text-sm break-words sm:gap-2.5 {{ class }}"
  {{ attrs }}
>
  {{ slot }}
</ol>
