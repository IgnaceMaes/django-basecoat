name: Coverage

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'django_basecoat/__init__.py'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: latest

      - name: Update dependencies
        run: uv lock

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=django_basecoat --cov-report=xml --cov-report=html
